<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css product card</title>
</head>
<style>
    .product.card img {
        max-width: 100%;
        min-width: 200px;
        border-radius: 8px;
        display: block;
        height: auto;
        margin: auto;
    }
    .product.card{
        height: 400px;
        width: auto;
        margin: 40px auto;
        padding: 20px;
        border: 2px solid #333;
        border-radius: 12px;
        background-color: #fff;
        box-sizing: border-box;
    }
    h2 {
        margin: 15px 0 10px;
        color: #2c3e50;}
    
</style>
<body>
    <div class="product card">
        <img src="https://assets.goal.com/images/v3/bltca72570f46251e34/nike_phantom_gx_-_laceless_boots.png?auto=webp&format=pjpg&width=3840&quality=60" alt="image of football shoes" width="300" height="200">

        <h2>Football Shoes</h2>

        <p>These are high-quality football shoes designed for optimal performance on the field.
            They feature durable materials, excellent traction, and a comfortable fit to enhance your game.
        ️ Price: ₹3,499

        </p>
    </div>
</body>
</html>
