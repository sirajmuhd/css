<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Food Delivery Service</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet">
</head>

<body>

<!-- Header -->
<header class="bg-dark text-white p-3">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h3 class="mb-0">FoodExpress</h3>
      </div>
      <div class="col-md-6 text-md-end">
        <a href="#" class="text-white me-3">Home</a>
        <a href="#" class="text-white">Contact</a>
      </div>
    </div>
  </div>
</header>

<!-- Main Section -->
<main class="container my-5">
  <div class="row">
    
    <!-- Left Column -->
    <div class="col-md-8">
      <h2>Welcome to FoodExpress</h2>
      <p>
        We deliver delicious food from your favorite restaurants right to your
        doorstep. Fast delivery, fresh meals, and great taste guaranteed!
      </p>
    </div>

    <!-- Right Column -->
    <div class="col-md-4">
      <img 
        src="https://via.placeholder.com/350x200" 
        class="img-fluid" 
        alt="Food Image">
    </div>

  </div>
</main>

<!-- Footer -->
<footer class="bg-light text-center p-3">
  © 2026 FoodExpress. All rights reserved.
</footer>

</body>
</html>
