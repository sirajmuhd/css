<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product table</title>
    <style>
        table{
            width: 60%;
             border-collapse:collapse;
             margin: 30px auto;
             font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        table,th,td{
            border: 2px solid black
        }
        th,td{
            background-color: grey;
            color:white;
            padding: 20px;
            text-align: center;
            
        }
        th{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <table>
           <tr>
               <th>ID</th>
               <th>PRODUCT NAME</th>
               <th>PRODUCT PRICE</th>

           </tr>
           <tr>
               <td>1</td>
               <td>shoes</td>
               <td>$4</td>
          </tr>
          <tr>
            <td>2</td>
            <td>jeans</td>
            <td>$5</td>
          </tr>
          <tr>
            <td>3</td>
            <td>shirt</td>
            <td>$6</td>
          </tr>
        <tr>
            <td>4</td>
            <td>watch</td>
            <td>$10</td>
        </tr>
        <tr>
            <td>5</td>
            <td>sunglass</td>
            <td>$15</td>
        </tr>
    </table>
</body>
</html>
