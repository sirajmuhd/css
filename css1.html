<!DOCTYPE html>
<html>
<head>
<style>
    body{ font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif
    background-color: #898383;
margin: auto; }
table, th, td {
  border: 2px solid rgb(230, 27, 27);
    border-collapse: collapse;
    padding: 10px;
    text-align: center;
    width: 50%;
    height: 50px;
}
</style>
</head>
<body>

<h2>Add a border to a table:</h2>

<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>salary</th>
    <th>experience</th>
  </tr>
  <tr>
    <td>Peter</td>
    <td>Griffin</td>
    <td>$50,000</td>
    <td>5 years</td>
  </tr>
  <tr>
    <td>Lois</td>
    <td>Griffin</td>
    <td>$45,000</td>
    <td>6 years</td>
  </tr>
</table>

</body>
</html>
