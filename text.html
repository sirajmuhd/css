<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Link Button</title>

  <style>
    /* Style anchor like a button */
    .btn-link {
      display: inline-block;
      text-decoration: none;     /* remove underline */
      background-color: #007bff;
      color: white;
      padding: 12px 25px;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 16px;
      transition: opacity 0.3s ease; /* smooth hover effect */
    }

    /* Hover effect using opacity */
    .btn-link:hover {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <a href="https://www.goal.com/en-in/lists/man-city-player-ratings-vs-newcastle-omar-marmoush-james-trafford/bltdcb7a515115b158a" class="btn-link">Click Me</a>
  

</body>
</html>
