<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Course Progress Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap 4 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <style>
    body {
      background-color: #f8f9fa;
    }
    .dashboard {
      max-width: 700px;
      margin: 50px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="dashboard">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb bg-light">
        <li class="breadcrumb-item"><a href="#">Home</a></li>
        <li class="breadcrumb-item"><a href="#">Courses</a></li>
        <li class="breadcrumb-item active" aria-current="page">Web Development</li>
      </ol>
    </nav>

    <!-- Heading with Badge -->
    <h2>
      Web Development Course
      <span class="badge badge-success">New</span>
    </h2>

    <hr>

    <!-- Progress Bars -->

    <!-- HTML -->
    <h6>HTML – 100% Complete</h6>
    <div class="progress mb-3">
      <div class="progress-bar bg-success progress-bar-striped"
           role="progressbar"
           style="width: 100%;">
        100%
      </div>
    </div>

    <!-- CSS -->
    <h6>CSS – 75% Complete</h6>
    <div class="progress mb-3">
      <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated"
           role="progressbar"
           style="width: 75%;">
        75%
      </div>
    </div>

    <!-- JavaScript -->
    <h6>JavaScript – 50% Complete</h6>
    <div class="progress mb-3">
      <div class="progress-bar bg-warning"
           role="progressbar"
           style="width: 50%;">
        50%
      </div>
    </div>

    <!-- Bootstrap -->
    <h6>Bootstrap – 25% Complete</h6>
    <div class="progress mb-4">
      <div class="progress-bar bg-danger"
           role="progressbar"
           style="width: 25%;">
        25%
      </div>
    </div>

    <!-- Button Group -->
    <div class="btn-group mb-4" role="group">
      <button type="button" class="btn btn-success">Start</button>
      <button type="button" class="btn btn-warning">Pause</button>
      <button type="button" class="btn btn-danger">Reset</button>
    </div>

    <!-- Pagination -->
    <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item active">
          <a class="page-link" href="#">1</a>
        </li>
        <li class="page-item">
          <a class="page-link" href="#">2</a>
        </li>
        <li class="page-item disabled">
          <a class="page-link" href="#">3</a>
        </li>
      </ul>
    </nav>

  </div>
</div>

<!-- Bootstrap 4 JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
