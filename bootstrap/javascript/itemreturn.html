<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function filterComment(comment) {

    // 1. Replace banned words (case-insensitive)
    let cleanedComment = comment.replace(/\b(bad|ugly|stupid)\b/gi, "***");

    // 2. Count numbers in the comment
    let numbers = comment.match(/\d+/g);
    let numberCount = numbers ? numbers.length : 0;

    // 3. Count words starting with capital letters
    let capitalWords = comment.match(/\b[A-Z][a-zA-Z]*/g);
    let capitalCount = capitalWords ? capitalWords.length : 0;

    // 4. Return result
    return {
        cleanedComment: cleanedComment,
        numbers: numberCount,
        capitalWords: capitalCount
    };
}

// Test comment
let comment = "I think this movie was BAD and 100% Stupid! But the Acting was Amazing and 3 actors were great.";

let result = filterComment(comment);

console.log("Cleaned Comment:", result.cleanedComment);
console.log("Number Count:", result.numbers);
console.log("Capitalized Word Count:", result.capitalWords);
    </script>
    
</body>
</html>
