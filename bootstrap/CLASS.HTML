<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 4 CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-primary">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 w-100" style="max-width:500px;">
        
        <h3 class="text-center mb-2">Sign Up</h3>
        <p class="text-center text-muted">Please fill in this form to create an account!</p>

        <form>
            <!-- First & Last Name -->
            <div class="form-row">
                <div class="form-group col-md-6">
                    <input type="text" class="form-control" placeholder="First Name">
                </div>
                <div class="form-group col-md-6">
                    <input type="text" class="form-control" placeholder="Last Name">
                </div>
            </div>

            <!-- Email -->
            <div class="form-group">
                <input type="email" class="form-control" placeholder="Email">
            </div>

            <!-- Password -->
            <div class="form-group">
                <input type="password" class="form-control" placeholder="Password">
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <input type="password" class="form-control" placeholder="Confirm Password">
            </div>

            <!-- Terms -->
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="terms">
                <label class="form-check-label" for="terms">
                    I accept the <a href="#">Terms of Use</a> & <a href="#">Privacy Policy</a>
                </label>
            </div>

            <!-- Button -->
            <button type="submit" class="btn btn-primary btn-block">
                Sign Up
            </button>
        </form>

        <hr>

        

        <p class="text-center mb-0">
            Already have an account? <a href="#">Login here</a>
        </p>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
