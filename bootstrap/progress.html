<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <title>Progress Report</title>

</head>
<body>
   <div class="container mt-4 ml-5">
    <ol class="breadcrumb">
         <li class="breadcrumb-item"><a href="#">Home</a></li>
      <li class="breadcrumb-item"><a href="#">Courses</a></li>
      <li class="breadcrumb-item"><a href="#">Web development</a></li>
      <li class="breadcrumb-item active" aria-current="page">Python</li>
    </ol>

    <h1 class="display-3 bg-active text-cente mt-4">Web Development Courses <sup><span
        class="bagde badge-info badge-pill">New</span></sup></h1>

        <h6>HTML 100%-completed</h6>
        <div class="progress-bar progress-bar-striped mb-3 bg-success">100%-completed</div>


        <h6>CSS-75% Completed</h6>
        <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary mb-3"
        style="width: 75%;">75%-complted</div>


        <h6>JavaScript-50% Completed</h6>
        <div class="progress-bar bg-warning mb-3" style="width:50%;">50%-completed

        </div>


        <h6>Bootstrap-25% Completed</h6>
        <div class="progress-bar bg-danger mb-3" style="width:25%;">25%-Completed</div>


         <div class="btn-group mx-5 mb-4">
            <button type="button" class="btn btn-success">Start</button>
            <button type="button" class="btn btn-warning">Pause</button>
            <button type="button" class="btn btn-danger">Reset</button>
         </div>


         <ul class="pagination justify-content-center">
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item disabled"><a class="page-link" href="#">3</a></li>
         </ul>


</div> 
    


</body>
