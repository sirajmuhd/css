<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    *{box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

    body{
        margin: 0;
    }
    .container{
      display: flex;
      height: 100vh;  
    }
    
    .left{
  width: 50%;
  background: linear-gradient(
  to bottom,
  #8f98a1,
  #b1b4b6,
  #d6c2b2,
  #e6d2b8
);
    }
    
    .right{
        width: 50%;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;

    }
    .login-box{
        width: 600px;
        
        padding: 30px;

    }
h2{
    color: #b3472d;
    margin-bottom: 20px;
}

label{
    display: block;
    margin-top: 10px;
    font-weight: bold;
}
input[type="text"],
input[type="password"]{
    width: 100%;
    padding: 10px;
    margin-top: 5px;
     border: 1px solid #ccc;
}

.remember{
    margin: 10px 0;
}

button{
    width: 100%;
    padding: 10px;
    color: white;
    border: none;
    font-size: 16px;
    cursor: pointer;
    background-color:#c85a3a;
}

@media screen and (max-width:768px) {
    .container{
    flex-direction: column;
  }

  .left{
    display: none;
  }

  .right{
    width: 100%;
    height: 100vh;
  }

  .login-box{
    width: 90%;
  }
}
    

</style>
<body>
    
 <div class="container">

  <div class="left"></div>

  <div class="right">
    <div class="login-box">
      <h2>Login Form</h2>

      <label>Email :</label>
      <input type="text">

      <label>Password :</label>
      <input type="password">

      <div class="remember">
        <input type="checkbox"> Remember Me
      </div>

      <button>Login</button>
    </div>
  </div>

</div>
</body>
</html>
