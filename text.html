<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Restaurant Menu</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Restaurant name */
        h3 {
            text-align: right;
            font-family: "Courier New", monospace;
            font-size: 26px;
            color: #2c3e50;
            margin-right: 40px;
        }

        /* Welcome message */
        .welcome {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 4px;
            word-spacing: 6px;
            margin: 20px 0;
            color: #555;
        }

        /* Table styling */
        table {
            width: 60%;
            margin: 30px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 2px solid #333;
            padding: 15px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background-color: #ddd;
        }

        /* Link styling */
        a {
            text-decoration: none;
            color: #2980b9;
        }

        a:hover {
            color: #e74c3c;
        }

        /* Icon styling */
        .icon {
            color: #e67e22;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <h3>
        <i class="fa-solid fa-utensils icon"></i>
        <i class="fa-solid fa-mug-hot icon"></i>
        Sunrise Diner
    </h3>

    <p class="welcome">
        Welcome to our restaurant
    </p>

    <table>
        <tr>
            <th>Item</th>
            <th>Price</th>
        </tr>
        <tr>
            <td>Veg Burger</td>
            <td>$5.99</td>
        </tr>
        <tr>
            <td>Grilled Sandwich</td>
            <td>$4.49</td>
        </tr>
        <tr>
            <td>Fresh Coffee</td>
            <td>$2.99</td>
        </tr>
    </table>

    <p style="text-align:center;">
        <a href="#">View Full Menu</a>
    </p>

</body>
</html>
