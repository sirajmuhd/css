<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        /* Company name styling */
        h3 {
            color: #23e718;
            text-align: right;
            font-family: "Verdana", sans-serif;
            margin-right: 40px;
            
        }
        .contact-info {
            font-size: 16px;
            margin-bottom: 20px;
            text-align: center;
            color: #261a80;
            text-transform: uppercase;
            letter-spacing: 1px;
            word-spacing: 2px;
        }
        table {
            width: 50%;
            border-collapse: collapse;
            margin: auto;
        }
        th, td {
            border: 1px solid #7a5e5e;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #a4ecac;
        }
    </style>
</head>
<body>
    <h3>partner soft technologies</h3>

    <p class="contact-info">Contact us at info@partnersoft.com

    </p>

    <table>
        <tr>
            <th>Department</th>
            <th>Contact Number</th>
        </tr>
        <tr>
            <td>Customer Support</td>
            <td>+1 800 123 4567</td>
        </tr>
        <tr>
            <td>Sales</td>
            <td>+1 800 987 6543</td>
        </tr>
    </table>
</body>
</html>
